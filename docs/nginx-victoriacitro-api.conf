# Snippet nginx para victoriacitro.net — API + uploads Kit Mundial (iPhone HEIC)
# Copiar dentro del server { } del sitio, o incluir con: include /ruta/a/este/archivo;
#
# IMPORTANTE para /kit-mundial desde iPhone:
#   - client_max_body_size: fotos iPhone 3–8 MB (default nginx = 1m → 413 sin log en Node)
#   - proxy_read_timeout: OpenAI quality=high tarda 50–80s (default 60s → 502 sin log de foto)

charset utf-8;

# Tamaño máximo de subida (fotos iPhone + multipart)
client_max_body_size 25m;

# Sitio estático (Astro dist/)
root /var/www/victoriacitro.net/dist;
index index.html;

# API → backend Node (puerto según tu .env PORT, usualmente 4000)
location /api/ {
    client_max_body_size 25m;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kit Mundial: subida + OpenAI puede tardar >60s en 4G
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # No bufferizar uploads grandes en disco del proxy
    proxy_request_buffering off;
}

location /admin {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA / páginas estáticas
location / {
    try_files $uri $uri/ $uri.html /index.html;
}
