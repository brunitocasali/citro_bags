<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cuando a los ángeles les devuelven las alas — una guía cálida y amorosa para atravesar el duelo de tu compañero de vida. Victoria Citro, arte y duelo."
    />
    <title>Cuando a los ángeles les devuelven las alas | Victoria Citro</title>
    <link rel="icon" href="/ebook/favicon-vc.png" type="image/png" />
    <link rel="apple-touch-icon" href="/ebook/favicon-vc.png" />
    <style>
      :root {
        --eb-cream: #f2eadf;
        --eb-gold: #b3924e;
        --eb-gold-dark: #9c7d3e;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        /* Fondo de marca para que en desktop los costados se vean intencionales, no vacíos. */
        background: radial-gradient(125% 85% at 50% 0%, #faf5ec 0%, #efe3cf 55%, #e4d5ba 100%);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Columna tipo funnel móvil: ancho completo en celular, centrada y "en tarjeta" en desktop. */
      .eb {
        max-width: 600px;
        margin: 0 auto;
        padding-bottom: 88px; /* espacio para el botón fijo de compra */
        background: var(--eb-cream);
        box-shadow: 0 24px 70px rgba(74, 55, 40, 0.22);
      }
      /* Botón de compra FIJO, siempre visible al hacer scroll (mobile + desktop). */
      .eb-cta-bar {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        max-width: min(560px, calc(100vw - 24px));
        padding: 15px 28px;
        border-radius: 999px;
        background: linear-gradient(135deg, #c8a24e, #a9812f);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
        box-shadow: 0 12px 32px rgba(90, 60, 20, 0.38);
        white-space: nowrap;
      }
      .eb-cta-bar b {
        font-weight: 800;
      }
      .eb-cta-bar__arrow {
        font-size: 18px;
      }
      .eb-cta-bar:active {
        transform: translateX(-50%) translateY(1px);
      }
      /* Cada sección es una imagen a ancho completo, sin márgenes ni gaps. */
      .eb-sec {
        position: relative;
        margin: 0;
        padding: 0;
        font-size: 0;
        line-height: 0;
      }
      .eb-sec picture,
      .eb-sec img {
        display: block;
        width: 100%;
        height: auto;
      }
      /* Hotspot de compra transparente, exactamente sobre el botón dibujado en la imagen. */
      .eb-hot {
        position: absolute;
        display: block;
        z-index: 2;
        -webkit-tap-highlight-color: rgba(179, 146, 78, 0.25);
        cursor: pointer;
      }
      .eb-hot:focus-visible {
        outline: 3px solid var(--eb-gold-dark);
        outline-offset: 2px;
        border-radius: 12px;
      }
      /* Links reales de la autora (Instagram + web), superpuestos en la sección "Conocé a la autora". */
      .eb-author-links {
        position: absolute;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        line-height: normal;
      }
      .eb-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-decoration: none;
        color: #fff;
        background: var(--eb-gold);
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(74, 55, 40, 0.18);
      }
      .eb-link--ghost {
        color: var(--eb-gold-dark);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(156, 125, 62, 0.5);
      }
      .eb-link:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="eb">
      <!-- 1 · HERO (archivo 4): portada + precio + botón "Quiero acceder a la guía" -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-1.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-1.jpg"
            width="1064"
            height="1478"
            alt="Cuando a los ángeles les devuelven las alas, Edición Perros, de Victoria Citro. Guía digital. $16.990 ARS. Acceso inmediato, lectura en cualquier dispositivo, garantía de 7 días."
            fetchpriority="high"
            decoding="async"
          />
        </picture>
        <a
          class="eb-hot"
          href="{{checkoutUrl}}"
          style="left: 51%; top: 60%; width: 47%; height: 8.5%"
          aria-label="Quiero acceder a la guía — ir al checkout"
        ></a>
      </figure>

      <!-- 2 · (archivo 3): "Cuando se van, el amor se queda" — collar y plato -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-2.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-2.jpg"
            width="1024"
            height="1536"
            alt="Cuando se van, el amor se queda. El collar sigue ahí. El plato sigue vacío."
            loading="lazy"
            decoding="async"
          />
        </picture>
      </figure>

      <!-- 3 · (archivo 2): "La camita sigue en el mismo lugar" — abrazo -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-3.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-3.jpg"
            width="914"
            height="1600"
            alt="La camita sigue en el mismo lugar. Hay momentos que dan ganas de abrazar el recuerdo."
            loading="lazy"
            decoding="async"
          />
        </picture>
      </figure>

      <!-- 4 · (archivo 1): "Si reconocés este vacío" + "Esta guía puede ayudarte a..." -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-4.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-4.jpg"
            width="759"
            height="1600"
            alt="Si reconocés este vacío, esta guía fue creada para vos. Esta guía puede ayudarte a comprender tu duelo, trabajar la culpa, encontrar ejercicios prácticos, realizar un ritual de despedida, conservar su memoria y volver a sentir calma y gratitud."
            loading="lazy"
            decoding="async"
          />
        </picture>
      </figure>

      <!-- 5 · (archivo 5): testimonios reales (WhatsApp) -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-5.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-5.jpg"
            width="1024"
            height="1536"
            alt="Ellos ya lo leyeron y estas son sus palabras: mensajes reales de lectoras agradeciendo la guía."
            loading="lazy"
            decoding="async"
          />
        </picture>
      </figure>

      <!-- 6 · (archivo 7): "¿Qué incluye la guía?" + reseñas + "Conocé a Victoria Citro" -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-6.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-6.jpg"
            width="840"
            height="1600"
            alt="¿Qué incluye la guía? Guía digital de más de 90 páginas, 7 capítulos con ejercicios y ritual de despedida, carta de despedida imprimible, recursos para acompañar a niños y adultos, acceso inmediato y para siempre. Reseñas de Mariana, Laura y Sofía. Conocé a Victoria Citro."
            loading="lazy"
            decoding="async"
          />
        </picture>
        <!-- Sección "Conocé a la autora": enlaces funcionales que abren en pestaña nueva. -->
        <div class="eb-author-links" style="left: 5%; top: 91.5%">
          <a
            class="eb-link"
            href="https://www.instagram.com/victoria.citro/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Seguí a Victoria Citro en Instagram (abre en una pestaña nueva)"
          >
            Instagram
          </a>
          <a
            class="eb-link eb-link--ghost"
            href="https://victoriacitro.net/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitá el sitio web de Victoria Citro (abre en una pestaña nueva)"
          >
            Sitio web
          </a>
        </div>
      </figure>

      <!-- 7 · (archivo 6): Preguntas frecuentes + CTA final (precio + medios de pago) -->
      <figure class="eb-sec">
        <picture>
          <source srcset="/ebook/landing/sec-7.webp" type="image/webp" />
          <img
            src="/ebook/landing/sec-7.jpg"
            width="900"
            height="1600"
            alt="Preguntas frecuentes. Tu corazón y su memoria merecen este espacio para sanar. $16.990 ARS, acceso inmediato, garantía de 7 días, pago seguro con Visa, Mastercard y Mercado Pago."
            loading="lazy"
            decoding="async"
          />
        </picture>
        <a
          class="eb-hot"
          href="{{checkoutUrl}}"
          style="left: 2%; top: 77.5%; width: 96%; height: 22%"
          aria-label="Comprar la guía — ir al checkout"
        ></a>
      </figure>
    </main>

    <!-- CTA fijo: siempre visible al hacer scroll, para que el llamado a la acción sea claro. -->
    <a class="eb-cta-bar" href="{{checkoutUrl}}" aria-label="Quiero mi guía por $16.990 — ir al checkout">
      <span>Quiero mi guía · <b>$16.990</b></span>
      <span class="eb-cta-bar__arrow" aria-hidden="true">→</span>
    </a>
  </body>
</html>
